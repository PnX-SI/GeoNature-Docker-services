name: CI - Docker Compose

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-docker-compose:
    runs-on: ubuntu-latest
    name: "traefik=${{ matrix.traefik }}"
    strategy:
      matrix:
        traefik: [false, true]
        include:
          - traefik: false
            expected_services: "geonature-backend geonature-frontend postgres redis usershub geonature-worker"
            url_backend: http://localhost:8000/geonature/api/healthz
            url_frontend: http://localhost:4200/geonature/#/
          - traefik: true
            expected_services: "geonature-backend geonature-frontend postgres redis usershub geonature-worker traefik"
            url_backend: http://localhost:8080/geonature/api/healthz
            url_frontend: http://localhost:8080/geonature/#/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Configure compose
        env: # FIXME: use default images
          GEONATURE_BACKEND_IMAGE: ghcr.io/bouttier/geonature-backend-extra:develop
          GEONATURE_FRONTEND_IMAGE: ghcr.io/bouttier/geonature-frontend-extra:develop
        run: |
          cp .env.sample .env
          sed -i "s|^DOCKER_UID=.*|DOCKER_UID=$(id -u)|" .env
          sed -i "s|^DOCKER_GID=.*|DOCKER_GID=$(id -g)|" .env
          sed  -i 's/.*\(GEONATURE_FRONTEND_PREFIX=.*\)/GEONATURE_FRONTEND_PREFIX=\/geonature/' .env
          sed  -i 's/.*\(GEONATURE_BACKEND_PREFIX=.*\)/GEONATURE_BACKEND_PREFIX=\/geonature\/api/' .env
          if [ "${{ matrix.traefik }}" = true ]; then
            echo Enable traefik
            sed -i 's/.*\(COMPOSE_FILE=.*:docker-compose.traefik.yml.*\)/\1/' .env
            sed -i 's/.*\(TRAEFIK_HTTP_PORT=.*\)/TRAEFIK_HTTP_PORT=8080/' .env
          else
            echo Disable traefik
            sed -i 's/.*\(COMPOSE_FILE=.*:docker-compose.traefik.yml.*\)/# \1/' .env
            sed -i 's/.*\(TRAEFIK_HTTP_PORT=.*\)/# \1/' .env
          fi
          sed -i "s|^GEONATURE_BACKEND_IMAGE=.*|# &|" .env
          sed -i "s|^GEONATURE_FRONTEND_IMAGE=.*|# &|" .env
          sed -i "s|^GEONATURE_BACKEND_DEV_IMAGE=.*|# &|" .env
          sed -i "s|^GEONATURE_FRONTEND_DEV_IMAGE=.*|# &|" .env
          {
            echo "GEONATURE_BACKEND_IMAGE=\"${GEONATURE_BACKEND_IMAGE}\""
            echo "GEONATURE_FRONTEND_IMAGE=\"${GEONATURE_FRONTEND_IMAGE}\""
            echo "GEONATURE_BACKEND_DEV_IMAGE=\"${GEONATURE_BACKEND_IMAGE}\""
            echo "GEONATURE_FRONTEND_DEV_IMAGE=\"${GEONATURE_FRONTEND_IMAGE}\""
          } >> .env
          echo "----- .env -----"
          cat .env
          echo "----- docker compose config -----"
          docker compose config

      - name: Start stack
        run: |
          ./init-config.sh
          docker compose up -d

      - name: Wait for services to be running
        run: |
          MAX_RETRIES=5
          RETRY_INTERVAL=10
          EXPECTED_SERVICES="${{ matrix.expected_services }}"

          echo "Expected services: $EXPECTED_SERVICES"

          check_service() {
            local service=$1
            for i in $(seq 1 $MAX_RETRIES); do
              if docker compose ps $service | grep -q "Up"; then
                echo "$service is running"
                return 0
              fi
              echo "Waiting for $service to be running (attempt $i/$MAX_RETRIES)..."
              sleep $RETRY_INTERVAL
            done
            echo "Error: $service failed to start after $MAX_RETRIES attempts"
            docker compose logs $service
            return 1
          }

          # Vérifier que tous les services attendus sont actifs
          for service in $EXPECTED_SERVICES; do
            if ! check_service $service; then
              exit 1
            fi
          done

          # Vérifier qu'aucun service inattendu n'est actif
          echo "Checking for unexpected running services..."
          RUNNING_SERVICES=$(docker compose ps --services --filter "status=running")

          for running_service in $RUNNING_SERVICES; do
            if [ "$running_service" = "geonature-install-db" ]; then
              echo "ℹ️  Ignoring optional service: $running_service"
              continue
            fi

            if ! echo "$EXPECTED_SERVICES" | grep -q "\b$running_service\b"; then
              echo "❌ Error: Unexpected service '$running_service' is running!"
              echo "Expected services: $EXPECTED_SERVICES"
              echo "Running services: $RUNNING_SERVICES"
              exit 1
            fi
          done

          echo "✅ All expected services are running and no unexpected services detected!"
          echo "Running services: $RUNNING_SERVICES"

      - name: Run integration tests
        run: |
          MAX_ATTEMPTS=5
          SLEEP_TIME=10
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i/$MAX_ATTEMPTS - Testing GeoNature availability..."
            if curl --insecure --fail --silent "${{ matrix.url_frontend }}" && \
               curl --insecure --fail --silent "${{ matrix.url_backend }}"; then
              echo "✅ GeoNature is ready!"
              exit 0
            fi
            echo "❌ Services not ready yet, waiting ${SLEEP_TIME}s..."
            sleep $SLEEP_TIME
          done
          echo "🚨 GeoNature failed to become available after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p logs
          docker compose ps -a --format json > logs/compose-ps.json 2>&1 || true
          docker compose ps -a > logs/compose-ps.txt 2>&1 || true
          docker compose config  > logs/compose-config.yml 2>&1 || true
          # Save aggregated logs
          docker compose logs --no-color --timestamps --tail=all > logs/compose-logs.txt 2>&1 || true
          # Save per-service logs
          for id in $(docker compose ps -aq 2>/dev/null); do
            name=$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "$id" 2>/dev/null || docker inspect --format '{{ .Name }}' "$id" 2>/dev/null | sed 's|^/||')
            [ -z "$name" ] && name="$id"
            docker logs --timestamps "$id" > "logs/${name}.log" 2>&1 || true
          done
          # Save env files
          for file in .env geonature-backend.env usershub.env geonature-frontend.env; do
            [ -f "$file" ] && cp "$file" "logs/$file" || true
          done
          echo "----- docker compose ps -a -----"
          docker compose ps -a
          echo "----- docker compose logs -----"
          docker compose logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-traefik=${{ matrix.traefik }}
          path: logs/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

      - name: Tear down
        if: always()
        run: docker compose down -v
