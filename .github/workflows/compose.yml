name: CI - Docker Compose

on:
  push:
    branches:
      - main
      - develop
      - feat/add_test_compose_dev
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-docker-compose:
    runs-on: ubuntu-latest
    name: "geonature=${{ matrix.version }} without_uh_with_https=${{ matrix.without_uh_with_https }}"
    strategy:
      matrix:
        version: ["2.17.5", "develop"]
        without_uh_with_https: [false, true]
        # We do only basic test (http with uh) for this version
        exclude:
          - version: "2.17.5"
            without_uh_with_https: true
        include: # /!\ image_owner must be lowercase
          - version: "2.17.5"
            image_owner: bouttier
            image_tag: "2.17.5-docker"
          - version: "develop"
            image_owner: "pnx-si"
            image_tag: "develop"
          - without_uh_with_https: false
            expected_services: "geonature-backend geonature-frontend postgres redis usershub geonature-worker traefik"
          - without_uh_with_https: true
            expected_services: "geonature-backend geonature-frontend postgres redis geonature-worker traefik"


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y curl monitoring-plugins-standard

      - name: Configure compose
        env:
          GEONATURE_BACKEND_IMAGE: ghcr.io/${{ matrix.image_owner }}/geonature-backend-extra:${{ matrix.image_tag }}
          GEONATURE_FRONTEND_IMAGE: ghcr.io/${{ matrix.image_owner }}/geonature-frontend-extra:${{ matrix.image_tag }}
        run: |
          cp .env.sample .env
          sed -i "s|^DOCKER_UID=.*|DOCKER_UID=$(id -u)|" .env
          sed -i "s|^DOCKER_GID=.*|DOCKER_GID=$(id -g)|" .env
          sed  -i 's/.*\(GEONATURE_FRONTEND_PREFIX=.*\)/GEONATURE_FRONTEND_PREFIX=\/geonature/' .env
          sed  -i 's/.*\(GEONATURE_BACKEND_PREFIX=.*\)/GEONATURE_BACKEND_PREFIX=\/geonature\/api/' .env
          sed -i "s|^GEONATURE_BACKEND_IMAGE=.*|# &|" .env
          sed -i "s|^GEONATURE_FRONTEND_IMAGE=.*|# &|" .env
          sed -i "s|^GEONATURE_BACKEND_DEV_IMAGE=.*|# &|" .env
          sed -i "s|^GEONATURE_FRONTEND_DEV_IMAGE=.*|# &|" .env
          {
            echo "GEONATURE_BACKEND_IMAGE=\"${GEONATURE_BACKEND_IMAGE}\""
            echo "GEONATURE_FRONTEND_IMAGE=\"${GEONATURE_FRONTEND_IMAGE}\""
            echo "GEONATURE_BACKEND_DEV_IMAGE=\"${GEONATURE_BACKEND_IMAGE}\""
            echo "GEONATURE_FRONTEND_DEV_IMAGE=\"${GEONATURE_FRONTEND_IMAGE}\""
          } >> .env
          
          if [ "${{ matrix.without_uh_with_https }}" = "true" ]; then
            echo "Removing usershub profiles..."
            sed -i 's/^COMPOSE_PROFILES=\(.*\)usershub\(.*\)$/COMPOSE_PROFILES=\1\2/' .env
          fi
          if [ "${{ matrix.without_uh_with_https }}" = "true" ]; then
            echo "Enabling Traefik HTTPS..."
            echo 'COMPOSE_FILE=${COMPOSE_FILE}:docker-compose.traefik-https.yml' >> .env
            sed -i 's|^#[[:space:]]*\(TRAEFIK_HTTPS_PORT=.*\)|\1|' .env
          fi
          echo "----- .env -----"
          cat .env
          echo "----- docker compose config -----"
          docker compose config

      - name: Start stack
        run: |
          ./init-config.sh
          docker compose up -d

      - name: Wait for services to be running
        run: |
          MAX_RETRIES=5
          RETRY_INTERVAL=10
          EXPECTED_SERVICES="${{ matrix.expected_services }}"

          echo "Expected services: $EXPECTED_SERVICES"

          check_service() {
            local service=$1
            for i in $(seq 1 $MAX_RETRIES); do
              if docker compose ps $service | grep -q "Up"; then
                echo "$service is running"
                return 0
              fi
              echo "Waiting for $service to be running (attempt $i/$MAX_RETRIES)..."
              sleep $RETRY_INTERVAL
            done
            echo "Error: $service failed to start after $MAX_RETRIES attempts"
            docker compose logs $service
            return 1
          }

          # Vérifier que tous les services attendus sont actifs
          for service in $EXPECTED_SERVICES; do
            if ! check_service $service; then
              exit 1
            fi
          done

          # Vérifier qu'aucun service inattendu n'est actif
          echo "Checking for unexpected running services..."
          RUNNING_SERVICES=$(docker compose ps --services --filter "status=running")

          for running_service in $RUNNING_SERVICES; do
            if [ "$running_service" = "geonature-install-db" ]; then
              echo "ℹ️  Ignoring optional service: $running_service"
              continue
            fi

            if ! echo "$EXPECTED_SERVICES" | grep -q "\b$running_service\b"; then
              echo "❌ Error: Unexpected service '$running_service' is running!"
              echo "Expected services: $EXPECTED_SERVICES"
              echo "Running services: $RUNNING_SERVICES"
              exit 1
            fi
          done

          echo "✅ All expected services are running and no unexpected services detected!"
          echo "Running services: $RUNNING_SERVICES"

      - name: Run integration tests
        env:
          CHECK_CURL: /usr/lib/nagios/plugins/check_curl --onredirect=curl
          BACKEND_URI: /geonature/api/healthz
          FRONTEND_URI: /geonature
        run: |
          MAX_ATTEMPTS=5
          SLEEP_TIME=10
          
          if [ "${{ matrix.without_uh_with_https }}" = "true" ]; then
            BACKEND_PORT=443
            FRONTEND_PORT=443
            CHECK_CURL="$CHECK_CURL --ssl"
          else
            BACKEND_PORT=80
            FRONTEND_PORT=80
          fi
          
          check_backend() {
            echo "--- backend check (localhost:${BACKEND_PORT}${BACKEND_URI}, expect 'OK') ---"
             $CHECK_CURL \
              --hostname localhost \
              --port "$BACKEND_PORT" \
              --url "$BACKEND_URI" \
              --string OK
          }

          check_frontend() {
            echo "--- frontend check (localhost:${FRONTEND_PORT}${FRONTEND_URI}, expect 'GeoNature') ---"
            $CHECK_CURL \
              --hostname localhost \
              --port "$FRONTEND_PORT" \
              --url "$FRONTEND_URI" \
              --string GeoNature
          }

          backend_ok=0
          frontend_ok=0

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "===== Attempt $i/$MAX_ATTEMPTS ====="

            if [ "$backend_ok" -eq 0 ]; then
              if check_backend; then
                echo "✅ backend is up"
                backend_ok=1
              else
                echo "❌ backend check failed"
              fi
            fi

            if [ "$frontend_ok" -eq 0 ]; then
              if check_frontend; then
                echo "✅ frontend is up"
                frontend_ok=1
              else
                echo "❌ frontend check failed"
              fi
            fi

            if [ "$backend_ok" -eq 1 ] && [ "$frontend_ok" -eq 1 ]; then
              echo "✅ GeoNature is ready (backend + frontend)!"
              exit 0
            fi

            echo "Not ready yet, waiting ${SLEEP_TIME}s..."
            sleep $SLEEP_TIME
          done

          echo "===== Summary after $MAX_ATTEMPTS attempts ====="
          if [ "$backend_ok" -eq 0 ]; then
            echo "🚨 BACKEND failed"
          fi
          if [ "$frontend_ok" -eq 0 ]; then
            echo "🚨 FRONTEND failed"
          fi
          exit 1

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p logs
          docker compose ps -a --format json > logs/compose-ps.json 2>&1 || true
          docker compose ps -a > logs/compose-ps.txt 2>&1 || true
          docker compose config  > logs/compose-config.yml 2>&1 || true
          # Save aggregated logs
          docker compose logs --no-color --timestamps --tail=all > logs/compose-logs.txt 2>&1 || true
          # Save per-service logs
          for id in $(docker compose ps -aq 2>/dev/null); do
            name=$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.service" }}' "$id" 2>/dev/null || docker inspect --format '{{ .Name }}' "$id" 2>/dev/null | sed 's|^/||')
            [ -z "$name" ] && name="$id"
            docker logs --timestamps "$id" > "logs/${name}.log" 2>&1 || true
          done
          # Save env files
          for file in .env geonature-backend.env usershub.env geonature-frontend.env; do
            [ -f "$file" ] && cp "$file" "logs/$file" || true
          done
          echo "----- docker compose ps -a -----"
          docker compose ps -a
          echo "----- docker compose logs -----"
          docker compose logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ matrix.version }}-without_uh_with_https=${{ matrix.without_uh_with_https }}
          path: logs/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

      - name: Tear down
        if: always()
        run: docker compose down -v

# ... existing code ...
      - name: Tear down
        if: always()
        run: docker compose down -v

  test-docker-compose-dev:
    # if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    name: "dev compose (docker-compose.dev.yml)"
    timeout-minutes: 90
    env:
      # Noms produits par `make -C GeoNature-images docker-dev` (DEV_TAG=dev par défaut)
      GEONATURE_BACKEND_DEV_IMAGE: geonature-backend-extra:dev
      GEONATURE_FRONTEND_DEV_IMAGE: geonature-frontend-extra:dev
      EXPECTED_SERVICES: "geonature-backend geonature-frontend postgres redis usershub geonature-worker traefik"

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y curl make jq git-lfs openssl monitoring-plugins-standard

      - name: Build dev images
        run: |
          make -C GeoNature-images docker-list-images
          make -C GeoNature-images docker-dev
          docker image ls

      - name: Configure compose
        run: |
          cp .env.sample .env
          sed -i "s|^DOCKER_UID=.*|DOCKER_UID=$(id -u)|" .env
          sed -i "s|^DOCKER_GID=.*|DOCKER_GID=$(id -g)|" .env
          sed  -i 's/.*\(GEONATURE_FRONTEND_PREFIX=.*\)/GEONATURE_FRONTEND_PREFIX=\/geonature/' .env
          sed  -i 's/.*\(GEONATURE_BACKEND_PREFIX=.*\)/GEONATURE_BACKEND_PREFIX=\/geonature\/api/' .env
          sed -i "s|^GEONATURE_BACKEND_DEV_IMAGE=.*|# &|" .env
          sed -i "s|^GEONATURE_FRONTEND_DEV_IMAGE=.*|# &|" .env
          {
            echo "GEONATURE_BACKEND_DEV_IMAGE=\"${GEONATURE_BACKEND_DEV_IMAGE}\""
            echo "GEONATURE_FRONTEND_DEV_IMAGE=\"${GEONATURE_FRONTEND_DEV_IMAGE}\""
            echo 'COMPOSE_FILE=${COMPOSE_FILE}:docker-compose.dev.yml'
          } >> .env
          echo "----- .env -----"
          cat .env
          echo "----- docker compose config -----"
          docker compose config
          # Vérifie que les images de dev sont bien utilisées
          docker compose config --images | grep -q "${GEONATURE_BACKEND_DEV_IMAGE}"
          docker compose config --images | grep -q "${GEONATURE_FRONTEND_DEV_IMAGE}"

      - name: Start stack
        run: |
          ./init-config.sh
          docker compose up -d --pull never

      - name: Wait for services to be running
        run: |
          MAX_RETRIES=10
          RETRY_INTERVAL=10
          for service in $EXPECTED_SERVICES; do
            ok=0
            for i in $(seq 1 $MAX_RETRIES); do
              if docker compose ps $service | grep -q "Up"; then
                echo "✅ $service is running"; ok=1; break
              fi
              echo "Waiting for $service (attempt $i/$MAX_RETRIES)..."
              sleep $RETRY_INTERVAL
            done
            if [ "$ok" -eq 0 ]; then
              echo "❌ $service failed to start"
              docker compose logs $service
              exit 1
            fi
          done

      - name: Run integration tests
        env:
          CHECK_CURL: /usr/lib/nagios/plugins/check_curl --onredirect=curl --timeout=30
        run: |
          # Le frontend de dev compile avec `ng serve` : on laisse jusqu'à ~20 min
          MAX_ATTEMPTS=80
          SLEEP_TIME=15
          backend_ok=0
          frontend_ok=0
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "===== Attempt $i/$MAX_ATTEMPTS ====="
            if [ "$backend_ok" -eq 0 ] && $CHECK_CURL --hostname localhost --port 80 --url /geonature/api/healthz --string OK; then
              echo "✅ backend is up"; backend_ok=1
            fi
            if [ "$frontend_ok" -eq 0 ] && $CHECK_CURL --hostname localhost --port 80 --url /geonature/ --string GeoNature; then
              echo "✅ frontend is up"; frontend_ok=1
            fi
            if [ "$backend_ok" -eq 1 ] && [ "$frontend_ok" -eq 1 ]; then
              echo "✅ GeoNature dev stack is ready!"
              exit 0
            fi
            sleep $SLEEP_TIME
          done
          [ "$backend_ok" -eq 0 ] && echo "🚨 BACKEND failed"
          [ "$frontend_ok" -eq 0 ] && echo "🚨 FRONTEND failed"
          exit 1

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p logs
          docker compose ps -a > logs/compose-ps.txt 2>&1 || true
          docker compose config > logs/compose-config.yml 2>&1 || true
          docker compose logs --no-color --timestamps --tail=all > logs/compose-logs.txt 2>&1 || true
          for file in .env geonature-backend.env usershub.env geonature-frontend.env; do
            [ -f "$file" ] && cp "$file" "logs/$file" || true
          done
          docker compose ps -a

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-dev
          path: logs/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

      - name: Tear down
        if: always()
        run: docker compose down -v