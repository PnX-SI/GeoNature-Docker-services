<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>GeoNature Docker services</title>
    <meta name="description" content="Déploiement de GeoNature et UsersHub avec Docker" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prism-themes@1/themes/prism-one-light.min.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: 'GeoNature Docker services',
        repo: 'https://github.com/PnX-SI/GeoNature-Docker-services',
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        // Le README.md racine est l'unique source ; docsify ne sert pas au-dessus de docs/
        // Local (localhost) : on lit le README de la copie de travail, exposé dans docs/ par `make docs`
        // (lien symbolique docs/README.md -> ../README.md, ignoré par git), ou ../README.md si le serveur
        // est lancé à la racine du dépôt. Sinon (GitHub Pages...), on lit le README publié sur GitHub.
        homepage: ['localhost', '127.0.0.1'].includes(location.hostname)
          ? location.pathname.startsWith('/docs/')
            ? '../README.md'
            : 'README.md'
          : 'https://raw.githubusercontent.com/PnX-SI/GeoNature-Docker-services/main/README.md',
        plugins: [
          function (hook) {
            // Le README racine référence docs/xxx.md et /docs/xxx.md ; docsify sert depuis docs/
            hook.beforeEach(function (md) {
              return md.replace(/\]\(\/?docs\//g, '](');
            });
          },
        ],
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
  </body>
</html>
