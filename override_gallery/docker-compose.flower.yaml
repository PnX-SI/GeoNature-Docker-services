###
# FLOWER - Interface de monitoring Celery
#
# Contexte :
#   Ajouter ce fichier si vous souhaitez monitorer les workers via une interface web. Attention, ce fichier
#   est fait pour le development et pas la production, déployer ce fichier dans un environnement de production présente
#   des risques de sécurité.
#
# Prérequis :
#   Utilisation de traefik (et donc de docker-compose.traefik.yaml) (ou alors exposer le port 5555)
#
# Accès :
#   https://<GEONATURE_BACKEND_HOST>/flower
#
# Testé:
#   date: 18/05/2026
#   version GDS: 2.17.1.2
#
# VARIABLES D'ENVIRONNEMENT
#
#   GEONATURE_CELERY__broker_url [défaut: redis://redis] — broker Celery suivi par Flower; c'est
#       la même variable que celle utilisée par le backend et le worker (injectée en
#       CELERY_BROKER_URL dans le conteneur).
#   FLOWER_HOST [défaut: GEONATURE_BACKEND_HOST] — domaine de Flower.
#   FLOWER_PREFIX [défaut: /flower] - chemin de base de Flower.
#       Par défaut, Flower est accessible à https://<GEONATURE_BACKEND_HOST>/flower.
###

services:
    flower:
      image: mher/flower:2.0
      environment:
        CELERY_BROKER_URL: ${GEONATURE_CELERY__broker_url:-redis://redis}
        FLOWER_URL_PREFIX: /flower
      depends_on:
        - geonature-worker
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.flower.rule=Host(`${FLOWER_HOST:-${GEONATURE_BACKEND_HOST}}`) && PathPrefix(`${FLOWER_PREFIX:-/flower}`)"
        - "traefik.http.routers.flower.entrypoints=websecure"
        - "traefik.http.services.flower.loadbalancer.server.port=5555"
